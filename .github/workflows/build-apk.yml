name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Create Simple Android Project
      run: |
        mkdir -p myapp/app/src/main/assets
        cp index.html myapp/app/src/main/assets/index.html

        mkdir -p myapp/app/src/main/java/com/web/app
        cat << 'EOF' > myapp/app/src/main/java/com/web/app/MainActivity.java
        package com.web.app;
        import android.app.Activity;
        import android.os.Bundle;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;

        public class MainActivity extends Activity {
            private WebView w;
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                w = new WebView(this);
                w.getSettings().setJavaScriptEnabled(true);
                w.setWebViewClient(new WebViewClient());
                w.loadUrl("file:///android_asset/index.html");
                setContentView(w);
            }
            @Override
            public void onBackPressed() {
                if (w.canGoBack()) { w.goBack(); }
                else { super.onBackPressed(); }
            }
        }
        EOF

        cat << 'EOF' > myapp/app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.web.app">
            <application
                android:label="My Digital World"
                android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > myapp/settings.gradle
        rootProject.name = "MyApp"
        include ':app'
        EOF

        cat << 'EOF' > myapp/build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:7.4.2'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        cat << 'EOF' > myapp/app/build.gradle
        apply plugin: 'com.android.application'
        android {
            namespace 'com.web.app'
            compileSdkVersion 33
            defaultConfig {
                applicationId "com.web.app"
                minSdkVersion 21
                targetSdkVersion 33
                versionCode 1
                versionName "1.0"
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

    - name: Build APK
      run: |
        cd myapp
        chmod +x gradlew || true
        gradle wrapper
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: my-app-apk
        path: myapp/app/build/outputs/apk/debug/app-debug.apk
